name: singular-flow

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: singular-flow-api:local
    container_name: singular-flow-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__SingularFlow: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-5278}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    stop_grace_period: 30s
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: singular-flow-postgres
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - singular_flow_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    stop_grace_period: 30s

volumes:
  singular_flow_postgres_data:
    name: singular-flow-postgres-data
