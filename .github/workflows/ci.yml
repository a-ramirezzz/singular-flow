name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: singular_flow_tests
          POSTGRES_USER: singular_flow
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U singular_flow -d singular_flow_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore SingularFlow.slnx

      - name: Verify formatting
        run: >
          dotnet format SingularFlow.slnx
          --verify-no-changes
          --no-restore

      - name: Build solution
        run: >
          dotnet build SingularFlow.slnx
          --configuration Release
          --no-restore

      - name: Run automated tests
        env:
          SINGULARFLOW_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=singular_flow_tests;Username=singular_flow;Password=ci_test_password
        run: >
          dotnet test SingularFlow.slnx
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"